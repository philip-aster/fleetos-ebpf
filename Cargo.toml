[workspace]
resolver = "2"
members = [
    "fleetos-ebpf-common",
    "fleetos-ebpf", "fleetos-ebpf-smoketest",
]

[workspace.dependencies]
# Assuming fleetos-core is checked out as a sibling directory
fleetos-core = { path = "../fleetos-core", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
